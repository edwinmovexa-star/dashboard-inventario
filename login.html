<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Inventario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-page">
    <section class="login-panel">
      <div class="login-card">
        <div class="mobile-brand">
          <div class="brand-mark">N</div>
          <strong>NOVENTIA</strong>
        </div>
        <img src="/img/logo2.png" alt="Logo" style="width: 150px; height: auto; max-width: 100%;" srcset="">

        <h2>Bienvenido</h2>
        <p class="subtitle">Ingresa con tu cuenta autorizada.</p>

        <form id="loginForm">
          <label>
            Correo electrónico
            <input
              type="email"
              id="loginEmail"
              autocomplete="email"
              placeholder="correo@noventia.com.mx"
              required
            >
          </label>

          <label>
            Contraseña
            <div class="password-wrap">
              <input
                type="password"
                id="loginPassword"
                autocomplete="current-password"
                placeholder="••••••••"
                required
              >
              <button type="button" id="togglePassword" aria-label="Mostrar contraseña">👁️</button>
            </div>
          </label>

          <button class="login-btn" id="loginBtn" type="submit">
            Iniciar sesión
          </button>
        </form>

        <p class="error-message" id="authError"></p>
        <p class="login-note">Acceso exclusivo para personal autorizado.</p>
      </div>
    </section>
  </main>

  <script type="module" src="login.js"></script>
</body>
</html>
